[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-cdrgen"
version = "0.1.1"
description = "ROS-free message generation and CDR codecs for Python, C++ and Rust"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]
requires-python = ">=3.10"
dependencies = ["rosbags==0.11.0", "empy==4.2", "lark==1.2.2", "setuptools>=70", "wheel", "tomli>=2; python_version < '3.11'"]

[project.scripts]
dimos-cdrgen = "dimos_cdrgen.source_package:main"

[project.optional-dependencies]
prepare = ["requests>=2.31"]
native = ["pip", "catkin-pkg==1.1.0", "PyYAML==6.0.2"]
test = ["pytest>=8", "pytest-mock", "mypy==1.19.0", "types-setuptools", "types-requests", "requests>=2.31", "build", "numpy>=1.26.4"]

[tool.setuptools]
packages = ["dimos_cdrgen", "rosidl_adapter", "rosidl_adapter.msg", "rosidl_adapter.srv", "rosidl_adapter.action", "rosidl_adapter.resource"]
package-dir = {"dimos_cdrgen" = "dimos_cdrgen", "rosidl_adapter" = "dimos_cdrgen/.upstream/rosidl_adapter"}
include-package-data = false

[tool.setuptools.package-data]
"dimos_cdrgen" = ["py.typed", "templates/*", "native_sources.json", "parser-source.json", "include/**/*.hpp"]

"rosidl_adapter" = ["resource/*.em", "LICENSE", "package.xml"]

[project.urls]
Repository = "https://github.com/TomCC7/dimos-cdrgen"
Issues = "https://github.com/TomCC7/dimos-cdrgen/issues"
