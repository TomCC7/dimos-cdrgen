site_name: dimos-cdrgen
site_description: Message generation and CDR codecs for Python, C++, and Rust.
site_url: https://tomcc7.github.io/dimos-cdrgen/
repo_url: https://github.com/TomCC7/dimos-cdrgen
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  icon:
    logo: material/code-braces
  palette:
    - media: '(prefers-color-scheme)'
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
nav:
  - Overview: index.md
  - Install the generator: install.md
  - Quickstarts:
      - Python: quickstarts/python.md
      - C++: quickstarts/cpp.md
      - Rust: quickstarts/rust.md
  - Reuse dependency types: guides/dependencies.md
  - Reference:
      - Message inputs: reference/inputs.md
      - Generated artifacts: reference/artifacts.md
      - CLI: reference/cli.md
      - Python API: reference/api.md
      - Compatibility: reference/compatibility.md
  - Maintain the documentation: contributing-docs.md
  - Validate and publish a release: publishing.md
plugins:
  - search
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
